services:
  base-de-donnees:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fausse boite mail pour le developpement : recoit les e-mails du backend sans rien envoyer.
  # Interface : http://localhost:8025 - serveur SMTP : localhost:1025 (depuis le PC) ou mailpit:1025 (depuis Docker).
  # Demarrage avec toute la plateforme : docker compose --profile dev up -d --build
  # Profil "dev" : ne demarre jamais sur le serveur de test ni en production.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  application:
    build: .
    restart: unless-stopped
    depends_on:
      base-de-donnees:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@base-de-donnees:5432/${POSTGRES_DB}
      PORT: "3000"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      ORIGINES_AUTORISEES: ${PUBLIC_BASE_URL:-http://localhost:3000}
      NOMBRE_PROXYS: ${NOMBRE_PROXYS:-1}
      # Adresse du tableau de bord : les liens des e-mails (mot de passe oublie) pointent ici.
      # Par defaut : PUBLIC_BASE_URL + /tableau-de-bord. Cette valeur remplace celle de backend/.env.
      TABLEAU_DE_BORD_URL: ${TABLEAU_DE_BORD_URL:-${PUBLIC_BASE_URL:-http://localhost:3000}/tableau-de-bord}
      # Dossier des logos des organisations : il est dans le volume donnees-logos (il survit aux redemarrages).
      LOGOS_DOSSIER: /app/televersements/logos
      # E-mails : dans Docker, "localhost" est le conteneur lui-meme, pas Mailpit. Ces valeurs remplacent
      # SMTP_HOTE, SMTP_PORT et SMTP_SECURISE de backend/.env. Avec un vrai service (Brevo, Mailgun...),
      # definir SMTP_HOTE_DOCKER, SMTP_PORT_DOCKER et SMTP_SECURISE_DOCKER dans le .env de la racine.
      SMTP_HOTE: ${SMTP_HOTE_DOCKER:-mailpit}
      SMTP_PORT: ${SMTP_PORT_DOCKER:-1025}
      SMTP_SECURISE: ${SMTP_SECURISE_DOCKER:-false}
    command: sh -c "npx prisma migrate deploy --config prisma7.config.ts && node dist/src/serveur.js"
    ports:
      - "3000:3000"
    volumes:
      - donnees-logos:/app/televersements/logos

volumes:
  donnees-postgres:
  donnees-logos: